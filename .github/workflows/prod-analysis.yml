# Runs on GitHub Actions using the repo's GCP_CREDENTIALS secret (no Cursor secret needed).
name: Production Analysis

on:
  workflow_dispatch:
    inputs:
      backtest_days:
        description: ORB Fyers backtest lookback (days)
        required: false
        default: "59"
      user_id:
        description: Fyers user id on production VM
        required: false
        default: "1"
  workflow_run:
    workflows: ["Deploy to Google Cloud VM"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write
  actions: read

env:
  GCP_PROJECT: sritej-trading-algo-2026
  GCP_INSTANCE: sritej-trading
  GCP_ZONE: asia-south1-c
  BACKTEST_DAYS: ${{ github.event.inputs.backtest_days || '59' }}
  BACKTEST_USER: ${{ github.event.inputs.user_id || '1' }}

jobs:
  prod-analysis:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud SSH
        run: gcloud compute config-ssh --quiet

      - name: Pull production backup
        id: pull
        run: bash scripts/pull_production_backup.sh

      - name: Package artifacts
        if: steps.pull.outcome == 'success'
        run: |
          mkdir -p artifact-bundle
          LATEST="$(ls -td backups/production/*/ 2>/dev/null | head -1)"
          if [ -n "$LATEST" ]; then
            cp -a "$LATEST" artifact-bundle/production-backup
          fi
          if [ -f trading-app/reports/orb_fyers_backtest.json ]; then
            mkdir -p artifact-bundle/reports
            cp trading-app/reports/orb_fyers_backtest.json artifact-bundle/reports/
          fi
          echo "Bundle contents:" && find artifact-bundle -type f | head -50

      - name: Upload analysis artifacts
        if: steps.pull.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prod-analysis
          path: artifact-bundle/
          retention-days: 7
          if-no-files-found: warn

      - name: Sync scripts to production VM
        continue-on-error: true
        run: |
          # shellcheck source=scripts/gcloud_deploy_upload.sh
          source scripts/gcloud_deploy_upload.sh
          upload_dir_to_remote_app_subpath trading-app/scripts \
            "${{ env.GCP_INSTANCE }}" scripts \
            "${{ env.GCP_ZONE }}" "${{ env.GCP_PROJECT }}" sritejpalika
          gcloud compute scp trading-app/fyers_client.py \
            "${{ env.GCP_INSTANCE }}:/tmp/fyers_client.py" \
            --zone="${{ env.GCP_ZONE }}" --project="${{ env.GCP_PROJECT }}" --quiet
          gcloud compute scp trading-app/engine/orb_filters.py \
            trading-app/engine/economic_calendar.py \
            "${{ env.GCP_INSTANCE }}:/tmp/" \
            --zone="${{ env.GCP_ZONE }}" --project="${{ env.GCP_PROJECT }}" --quiet
          gcloud compute ssh "${{ env.GCP_INSTANCE }}" \
            --zone="${{ env.GCP_ZONE }}" --project="${{ env.GCP_PROJECT }}" --quiet \
            --command="sudo cp /tmp/fyers_client.py /home/sritejpalika/trading-app/ && \
              sudo cp /tmp/orb_filters.py /tmp/economic_calendar.py /home/sritejpalika/trading-app/engine/ && \
              sudo chown sritejpalika:sritejpalika /home/sritejpalika/trading-app/fyers_client.py \
                /home/sritejpalika/trading-app/engine/orb_filters.py \
                /home/sritejpalika/trading-app/engine/economic_calendar.py"

      - name: Run ORB Fyers backtest on production VM
        id: fyers_backtest
        continue-on-error: true
        run: bash scripts/run_orb_fyers_on_prod.sh "$BACKTEST_DAYS" "$BACKTEST_USER"

      - name: Upload backtest report (if produced)
        if: hashFiles('trading-app/reports/orb_fyers_backtest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prod-analysis-backtest
          path: trading-app/reports/orb_fyers_backtest.json
          retention-days: 7

      - name: Enable ORB+S9 shadow week on production
        continue-on-error: true
        run: bash scripts/apply_shadow_week_on_prod.sh "$BACKTEST_USER" 7

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            echo "✅ Production DB backup uploaded as artifact: prod-analysis"
          fi
          if [ "${{ steps.fyers_backtest.outcome }}" != "success" ]; then
            echo "::warning::Fyers backtest did not complete. Log in to prod Fyers if needed, then re-run."
          fi
